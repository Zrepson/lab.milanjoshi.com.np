name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if needed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps:deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ hashFiles('package-lock.json') ? 'npm' : 'yarn' }}

      - name: Install Dependencies
        run: npm ci # Use 'yarn install' or 'pnpm install' if applicable

      - name: Build Static Site
        run: npm run build # Executes next build and creates the 'out' directory

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out # Tells GitHub to upload the static export folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
